name: Windows backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: cry memory windows backend
    env:
      CRY_MEMORY_WINDOWS_SMOKE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      IM_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Check out into a path containing spaces
        uses: actions/checkout@v4
        with:
          path: cry memory windows backend

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cry memory windows backend/requirements.txt

      - name: Install FFmpeg
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Install uv for the native setup launcher
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Provision through the Windows PowerShell 5.1 setup launcher
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content -Raw .\scripts\setup_windows.ps1))
          [void][scriptblock]::Create((Get-Content -Raw .\scripts\run_windows.ps1))
          .\scripts\setup_windows.ps1

      - name: Exercise the Windows PowerShell 5.1 run launcher
        shell: powershell
        run: |
          $Port = 8765
          $RepoRoot = (Get-Location).Path
          $HealthUri = [uri]"http://127.0.0.1:$Port/api/health"
          $ServerJob = Start-Job -ScriptBlock {
              param($Root, $ListenPort)
              Set-Location $Root
              & .\scripts\run_windows.ps1 -Mode Desktop -Port $ListenPort
          } -ArgumentList $RepoRoot, $Port
          try {
              $Deadline = (Get-Date).AddMinutes(6)
              $Health = $null
              while ((Get-Date) -lt $Deadline) {
                  if ($ServerJob.State -notin @("NotStarted", "Running")) {
                      Receive-Job $ServerJob -Keep
                      throw "Desktop launcher job stopped with state $($ServerJob.State)."
                  }
                  try {
                      $Health = Invoke-RestMethod -Method Get -Uri $HealthUri
                      if ($Health.status -eq "ready") {
                          break
                      }
                  } catch {
                      $Health = $null
                  }
                  Start-Sleep -Seconds 2
              }
              if ($null -eq $Health -or $Health.status -ne "ready") {
                  Receive-Job $ServerJob -Keep
                  throw "Desktop launcher did not reach ready health."
              }
              .\scripts\run_windows.ps1 -Mode Health -HealthUri $HealthUri
          } finally {
              if ($ServerJob.State -eq "Running") {
                  Stop-Job $ServerJob
              }
              Receive-Job $ServerJob -ErrorAction Continue
              Remove-Job $ServerJob -Force
          }

      - name: Run Windows platform regressions and real backend smoke
        shell: powershell
        run: |
          $Python = (Resolve-Path .\.venv\Scripts\python.exe).Path
          & $Python -m unittest -v `
              tests.test_windows_portability `
              tests.test_product_session `
              tests.test_product_render `
              tests.test_mobile_capture_spike `
              tests.test_windows_backend_smoke
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
